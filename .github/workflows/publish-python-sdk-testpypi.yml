name: Publish Python SDK to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, test and publish to TestPyPI
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/messagex-client
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/python-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Install SDK
        run: python -m pip install -e .

      - name: Run SDK tests
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -v

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Publish to TestPyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: packages/python-sdk/dist/
