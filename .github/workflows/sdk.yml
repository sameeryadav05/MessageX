name: JavaScript SDK

on:
  push:
    branches:
      - main
      - feature/javascript-sdk
    paths:
      - "packages/javascript-sdk/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "packages/javascript-sdk/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sdk.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build and test SDK
        run: npm run test:sdk
