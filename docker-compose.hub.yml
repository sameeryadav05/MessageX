name: messagex

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: messagex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: messagex
    volumes:
      - messagex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messagex -d messagex"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  broker:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/messagex-broker:${MESSAGEX_BROKER_VERSION:?Set MESSAGEX_BROKER_VERSION}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      HTTP_PORT: 3000
      TCP_PORT: 5678
      DATABASE_URL: postgresql://messagex:${POSTGRES_PASSWORD}@postgres:5432/messagex
      ACK_TIMEOUT_SECONDS: 30
      ACK_TIMEOUT_CHECK_INTERVAL_MS: 5000
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["3000"]
    ports:
      - "${TCP_BIND_ADDRESS:-0.0.0.0}:${TCP_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [internal]

  dashboard:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/messagex-dashboard:${MESSAGEX_DASHBOARD_VERSION:?Set MESSAGEX_DASHBOARD_VERSION}
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-0.0.0.0}:${DASHBOARD_PORT:-15672}:80"
    networks: [internal]

  admin-init:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/messagex-broker:${MESSAGEX_BROKER_VERSION:?Set MESSAGEX_BROKER_VERSION}
    restart: "no"
    command: ["node", "apps/broker/scripts/bootstrap-admin.mjs"]
    environment:
      DATABASE_URL: postgresql://messagex:${POSTGRES_PASSWORD}@postgres:5432/messagex
      MESSAGEX_ADMIN_USERNAME: ${MESSAGEX_ADMIN_USERNAME:?Set MESSAGEX_ADMIN_USERNAME}
      MESSAGEX_ADMIN_PASSWORD: ${MESSAGEX_ADMIN_PASSWORD:?Set MESSAGEX_ADMIN_PASSWORD}
    depends_on:
      broker:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  messagex_postgres_data:
