
services:
  postgres:
    image: postgres:17
    container_name: messagex-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: messagex
      POSTGRES_PASSWORD: messagex_dev_password
      POSTGRES_DB: messagex

    ports:
      - "5433:5432"

    volumes:
      - messagex_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messagex -d messagex"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  messagex_postgres_data:
