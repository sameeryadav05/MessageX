[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "messagex-client"
version = "0.1.0"
description = "Official Python (asyncio) client for the MessageX message broker"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["messagex", "message-broker", "queue", "pubsub", "messaging", "tcp", "asyncio", "event-driven"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sameeryadav05/MessageX/tree/main/packages/python-sdk"
Repository = "https://github.com/sameeryadav05/MessageX"
Issues = "https://github.com/sameeryadav05/MessageX/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
messagex = ["py.typed"]
